name: Security

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  security:
    name: Check security concerns with bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          environments: dev
          cache: true
      - name: Run bandit
        run: pixi run -e dev check-security
        shell: bash
