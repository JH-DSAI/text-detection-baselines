name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: lint with pixi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          pixi-version: v0.74.0
          environments: dev
          cache: true
      - name: Lint
        run: pixi run -e dev check-style
        shell: bash

  test:
    name: pytests on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      COVERAGE_XML: coverage.xml
      PATCH_MIN_THRESHOLD: 80
    steps:
    - name: Compute 312-style Python version
      run: echo "PYTHON_ALT=${PYTHON//./}" >> $GITHUB_ENV

    - uses: actions/checkout@v6
      with:
          lfs: true
          fetch-depth: 0
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.8.14
      with:
        pixi-version: v0.74.0
        environments: test-py${{ env.PYTHON_ALT }}
        cache: true
    - name: Test with pixi (pytest)
      run: pixi run -e test-py${PYTHON_ALT} test
    # Only save & upload coverage once per commit
    - name: Archive coverage report
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-${{ github.run_id }}
        path: ${{ env.COVERAGE_XML }}
        retention-days: 14
        if-no-files-found: error
    - name: Evaluate patch coverage
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
      uses: Affanmir/diff-cover-action@v2.1.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        coverage-files: ${{ env.COVERAGE_XML }}
        create-annotations: true
        compare-branch: "origin/${{ github.base_ref }}"
        fail-under: ${{ env.PATCH_MIN_THRESHOLD }}

  docs:
    name: Build docs with pixi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          pixi-version: v0.74.0
          environments: docs
          cache: true
      - name: Build sphinx docs.
        run: pixi run -e docs build-docs
        shell: bash

  build:
    name: Build and Publish.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
