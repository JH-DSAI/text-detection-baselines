# Example evaluation configuration file
# Copy this to eval_config.yaml and customize for your data/models

data:
  # Path to JSONL file with human-generated documents
  # Each line should be JSON with at least the text_key field
  human_support: data/human_documents.jsonl
  
  # Path to JSONL file(s) with machine-generated documents
  # Can be a single path (str) or list of paths for few-shot scenarios
  # Each line should be JSON with the text_key field
  machine_support: data/machine_documents.jsonl
  # machine_support:
  #   - data/gpt4_documents.jsonl
  #   - data/claude_documents.jsonl
  
  # Path to held-out validation set (JSONL format)
  # Must contain documents with:
  #   - text_key field: the document text
  #   - "label" field (0=human, 1=machine) OR
  #   - label_key field: category for per-category metrics
  validation: data/validation_set.jsonl
  
  # JSON field name containing the text to analyze
  text_key: text
  
  # Optional: field name for per-category metrics
  # If present, outputs per-category detection rates
  # Common values: "source", "model", "contribution_level"
  label_key: contribution_level

# Evaluation output settings
evaluation:
  # Directory to save results
  # Can be overridden via CLI: --output-dir ./eval_run_2/
  output_dir: ./eval_results/

# Example validation data format (JSONL):
# {"text": "This is a human-written document.", "contribution_level": "Human"}
# {"text": "Generated by GPT-4 model.", "contribution_level": "GPT-4"}
# {"text": "Created by Claude.", "contribution_level": "Claude"}

# To run evaluation:
#   python evaluate.py --config eval_config.yaml
#
# Results will be saved to eval_results/:
#   - results.jsonl: Single JSON object with all metrics
#   - summary.txt: Human-readable table with main metrics + per-category breakdown
#   - features/: Cached extracted features (reused on subsequent runs)
