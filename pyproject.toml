[project]
name = "text-detection-baselines"
dynamic = ["version"]
authors = [
    {name = "JHU Data Science and AI Institute"},
    {name = "JHU Human Language Technology Center of Excellence"},
]
description = ""
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*", ".zenodo.json"]

requires-python = ">=3.11"
dependencies = ["click>=8.3.2,<9", "pyyaml>=6.0.3,<7", "rich>=15.0.0,<16", "transformers>=4.44,<5"]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "hatchling>=1.27",
    "hatch-vcs>=0.4"
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx_book_theme",
    "sphinx-automodapi",
    "nbsphinx"
]

[project.urls]
homepage = "https://github.com/JH-DSAI/text-detection-baselines.git"
documentation = "https://github.com/JH-DSAI/text-detection-baselines.git"
repository = "https://github.com/JH-DSAI/text-detection-baselines.git"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "text_detection_baselines/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["text_detection_baselines"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 120
lint.select = ["ALL"]
lint.ignore = [
    "ANN002",  # https://docs.astral.sh/ruff/rules/missing-type-args/
    "ANN003",  # https://docs.astral.sh/ruff/rules/missing-type-kwargs/
    "ANN401",  # https://docs.astral.sh/ruff/rules/any-type/
    "PLR0913",  # https://docs.astral.sh/ruff/rules/too-many-arguments/
    "EM101",  # https://docs.astral.sh/ruff/rules/raw-string-in-exception/
    "EM102",  # https://docs.astral.sh/ruff/rules/f-string-in-exception/
    "TRY003",  # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "D407",  # https://docs.astral.sh/ruff/rules/dashed-underline-after-section/
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "ISC001", # https://docs.astral.sh/ruff/rules/single-line-implicit-string-concatenation/
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".pixi",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "docs",
    "node_modules",
    "venv",
    "_version.py"
]
target-version = "py311"

[tool.ruff.lint.pydocstyle] # https://docs.astral.sh/ruff/settings/#lint_pydocstyle_convention
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/test{s,}/*.py" = [
    "S101",  # https://docs.astral.sh/ruff/rules/assert/
    "D",  # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "ARG001",  # https://docs.astral.sh/ruff/rules/unused-function-argument/
    "INP",  # https://docs.astral.sh/ruff/rules/#flake8-no-pep420-inp
    "ANN",  # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"  # https://docs.astral.sh/ruff/settings/#lint_flake8-quotes_docstring-quotes
inline-quotes = "double"  # https://docs.astral.sh/ruff/settings/#lint_flake8-quotes_inline-quotes
multiline-quotes = "double"  # https://docs.astral.sh/ruff/settings/#lint_flake8-quotes_multiline-quotes

[tool.mypy]
files = ["text_detection_baselines/**/*.py"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.15"
pytorch = "~=2.0"
numpy = "~=2.4"
scikit-learn = "~=1.8"
transformers = "~=4.57"

[tool.pixi.pypi-dependencies]
text-detection-baselines = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
bandit = ">=1.7"
build = ">=1.0"
pytest = ">=9.0"
pytest-cov = ">=7.1"
ruff = ">=0.15"
mypy = ">=1.20"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx = ">=9.0"
sphinx_rtd_theme = ">=3.1"
sphinx_book_theme = ">=1.2"
sphinx-automodapi = ">=0.22"
nbsphinx = ">=0.9"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.cuda]
channels = ["nvidia"]
dependencies = {cuda = "12.*", pytorch-gpu = "2.*"}
platforms = ["linux-64", "linux-aarch64", "win-64"]
system-requirements = {cuda = "12"}

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["dev", "docs"], solve-group = "default" }
dist = { features = ["dev"], solve-group = "default" }
test-py311 = { features = ["dev", "py311"], solve-group = "test-py311" }
test-py312 = { features = ["dev", "py312"], solve-group = "test-py312" }
test-py313 = { features = ["dev", "py313"], solve-group = "test-py313" }
test-py314 = { features = ["dev", "py314"], solve-group = "test-py314" }
cuda = { features = ["cuda"], solve-group = "default" }

[tool.pixi.tasks]
check-style = "ruff format . --check && ruff check ."
check-security = "bandit -c pyproject.toml --severity-level=medium -r text_detection_baselines"
check-types = "mypy"
format = "ruff format . && ruff check --select I --fix ."
test = "pytest --cov=text_detection_baselines --cov-report=html:coverage.html --cov-report=xml:coverage.xml"
build-docs = "cd docs && make clean html latex epub"
build-dist = "python -m build"
main = "python -m text_detection_baselines.cli"
lint = { depends-on = ["check-style", "check-security", "check-types"] }
ci = { depends-on = ["lint", "test"] }
